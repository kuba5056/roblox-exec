[package]
name = "rbx-exec-ui"
version = "0.1.0"
edition = "2021"

[dependencies]
gtk4 = { version = "0.9", features = ["v4_12"] }
glib = "0.20"
sourceview5 = "0.9"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "macros"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "5"
async-channel = "2"
once_cell = "1"

[[bin]]
name = "rbx-exec-ui"
path = "src/main.rs"
